# gitleaks configuration: the default rules, plus the confirmed false positives of this repository.
#
# Every allowlist entry must name what it allows and why it is not a secret, and must be as narrow as
# possible (a path and a pattern, never a whole rule). A real secret is never allowlisted: it is rotated,
# and the team decides whether the history is rewritten.
#
# Full-history scan of every branch on 2026-09-25 (gitleaks 8.30.1, 104 commits): no finding, so no
# allowlist entry is needed yet.

title = "cryptopilot"

[extend]
useDefault = true

# One past commit of the payment branch (T-068) signed a test IPN with a public gateway sandbox key. The key is not
# in the current tree any more (tests use made-up keys) and the history is not rewritten, so only that commit and that
# file are allowed; the value itself is not repeated here.
[[allowlists]]
description = "Test IPN signed with a public sandbox key in one past commit (T-068)"
condition = "AND"
commits = ["53ba9aa6bf1ddefc10075cee3b0f5f597ba1c16b"]
paths = ['''backend/src/test/java/com/cryptopilot/billing/controller/PaymentCallbackApiTest\.java''']
