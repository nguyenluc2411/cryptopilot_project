# Continuous integration of the backend and the AI Service: every pull request into develop or main, and every push to
# develop, builds the backend and runs the whole suite exactly as the team does locally —
#
#     ./mvnw -B verify
#
# which compiles with warnings as errors, checks formatting (Spotless), runs the unit, architecture
# and integration tests (Testcontainers on the runner's own Docker) and enforces the JaCoCo coverage
# gate. A red build means the change does not integrate; the job name "build-and-test" is stable so it
# can be made a required status check on develop and main.
#
# T-009 adds two things. A pull request is also held to the coverage of develop: its line and branch
# coverage may not fall more than 0.1 points below those of the latest green develop build
# (tools/ci/coverage_gate.py; the fixed minimum of pom.xml still applies). And the container images of the
# backend and the AI Service are built on every run; on a push to develop they are pushed to the GitHub
# Container Registry with the run's own token (no stored secret), tagged with the commit and "develop".
# Deploying stays manual (deploy/README.md "Staging").
#
# Tests tagged "live" call the real exchange and stay excluded, as in every local build: the Surefire
# configuration excludes them, and a CI runner may be geo-blocked (HTTP 451) anyway.
#
# Reference: Humble, J. & Farley, D. (2010). Continuous Delivery. Addison-Wesley, ch. 3 ("Continuous
# Integration": build and test every change on a clean machine, keep the build green, and treat a
# broken build as the first thing to fix).

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# No permission at workflow level; each job asks for exactly what it uses. The build only reads the
# repository: artifacts are uploaded with the runner's own token, not GITHUB_TOKEN, and no secret is used,
# so a pull request from a fork runs with the same read-only rights.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request makes the older run pointless; a run on develop is kept,
  # because it records whether develop itself is green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only to read the coverage report of the latest green develop build (the coverage gate).
      actions: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The build never pushes, so the token is not left in the local git configuration.
          persist-credentials: false

      - name: Set up Java 21 (Temurin) with the Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run the full suite with the coverage gate
        run: ./mvnw -B -ntp verify

      - name: Fetch the coverage of the latest green develop build
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch develop --event push \
            --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n jacoco-report -D "$RUNNER_TEMP/baseline" \
              || echo "The report of run $run_id is gone (kept 14 days); nothing to compare."
          fi

      - name: Refuse a coverage drop against develop
        if: github.event_name == 'pull_request'
        run: python3 ../tools/ci/coverage_gate.py target/site/jacoco/jacoco.xml "$RUNNER_TEMP/baseline/jacoco.xml"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # The AI Service (Node.js, TypeScript): the type check and the vitest suite, on the same triggers as the
  # backend. Its tests replace the LLM provider, so no key or secret is needed.
  ai-service-test:
    name: ai-service-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22 (engines in ai-service/package.json) with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-service/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run the tests
        run: npm test

  # The container images (T-004, T-009). Built on every run, once the tests are green, so a broken Dockerfile shows in
  # the pull request; pushed only on a push to develop, to ghcr.io/<owner>/cryptopilot-backend and -ai-service, with the
  # run's own token. The web image is built by the web repository: its backend address is compiled in, so the staging
  # host builds it (deploy/docker-compose.yml).
  images:
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test, ai-service-test]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sign in to the GitHub Container Registry
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build, and on develop push, the backend and AI Service images
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          for component in backend ai-service; do
            image="ghcr.io/$owner/cryptopilot-$component"
            docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image:$GITHUB_SHA" -t "$image:develop" "$component"
            if [ "$PUSH" = "true" ]; then
              docker push "$image:$GITHUB_SHA"
              docker push "$image:develop"
            fi
          done
