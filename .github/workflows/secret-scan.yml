# Secret scan: every pull request, whatever its target, and every push to develop and main, runs gitleaks
# over the whole history reachable from the checked-out commit. A finding fails the job "secret-scan", which
# is stable so it can be made a required status check. Findings are printed redacted.
#
# gitleaks is downloaded as a pinned release and checked against its published SHA-256 before it runs, so the
# job depends on no third-party action and on no licence key. To upgrade, change GITLEAKS_VERSION and
# GITLEAKS_SHA256 together, from gitleaks_<version>_checksums.txt of the release.
#
# Rules: the gitleaks defaults, extended by .gitleaks.toml at the repository root.
#
# The job reads the repository and nothing else: no secret is available to it, and pull requests from forks
# run with the same read-only token.

name: Secret scan

on:
  pull_request:
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1 .
