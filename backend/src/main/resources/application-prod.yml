spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      console: ecs

cryptopilot:
  # Production unless the environment says otherwise; staging runs this profile too and sets
  # CRYPTOPILOT_ENVIRONMENT=staging, without which the demo profile refuses to start (D-120).
  environment: ${CRYPTOPILOT_ENVIRONMENT:production}
  outbox:
    # T-056 runs in this profile: failed event deliveries (mail) are retried.
    enabled: true
  media:
    sweep:
      # Runs in this profile: files no post carries are deleted from Cloudinary daily.
      enabled: true
  notification:
    mail:
      # From the environment only, no default: a production mail must come from a real sender and link to the real site.
      from: ${SMTP_FROM}
      public-base-url: ${PUBLIC_BASE_URL}
    sweep:
      # NSF-17 runs in this profile: notifications older than 90 days are deleted daily.
      enabled: true
  web:
    # From the environment only: the Nginx address or network. No default, so nothing is trusted until it is set.
    trusted-proxies: ${TRUSTED_PROXIES:}
    cors:
      # From the environment only, exact origins (https://app.example.com). No default: until it is set, every
      # cross-origin caller is refused.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      # ADR-014: always on here; the defaults are the TECHNICAL_DESIGN 5.3 limits, per minute.
      enabled: true
      login: ${RATE_LIMIT_LOGIN:10}
      auth: ${RATE_LIMIT_AUTH:20}
      api: ${RATE_LIMIT_API:120}
      paper-orders: ${RATE_LIMIT_PAPER_ORDERS:50}
      guest: ${RATE_LIMIT_GUEST:300}
  auth:
    token-sweep:
      # NSF-17 runs in this profile: expired refresh tokens are deleted daily.
      enabled: true
  market:
    sync:
      # NSF-01 runs in this profile: at start-up and on the schedule of application.yml.
      enabled: true
      # The demo pairs (Q-05), created INACTIVE by NSF-01 the first time each market lists them; an
      # administrator activates them. Each is spelled the same on Spot and USD-M futures (Q-14).
      seed-symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
        - SOLUSDT
        - XRPUSDT
        - DOGEUSDT
        - ADAUSDT
        - AVAXUSDT
        - LINKUSDT
        - LTCUSDT
        - BCHUSDT
        - UNIUSDT
        - ARBUSDT
    backfill:
      # NSF-02 runs in this profile: after each symbol synchronisation and on the hourly schedule of
      # application.yml, within half of each venue's weight budget.
      enabled: true
    stream:
      # NSF-03 runs in this profile: the streams of the pairs an administrator enabled (BR-07).
      enabled: true
    cache:
      # T-022 runs in this profile: the latest prices are written to Redis.
      enabled: true
    hub:
      # T-022 runs in this profile: the market topics are pushed to STOMP clients.
      enabled: true
    futures-metrics:
      # NSF-04 runs in this profile: the futures metrics and funding settlements of the streamed pairs.
      enabled: true
  trading:
    expiry:
      # NSF-09 runs in this profile: ACTIVE plans whose expiry has come are expired every minute.
      enabled: true
    matching:
      replay:
        # T-043 runs in this profile: after a restart, the closed 1-minute candles missed since the
        # watermark are fetched from the exchange and replayed (A-04).
        enabled: true
  paper:
    equity-snapshot:
      # TR-13 runs in this profile: every paper account's worth is recorded at 00:00 UTC.
      enabled: true
    grant-cost:
      # PT-R13 runs in this profile: the granted coins without a cost get one once they have a price.
      enabled: true
    pair-stop-sweep:
      # NSF-01 runs in this profile: Spot paper orders left open on a pair that stopped trading are cancelled.
      enabled: true
    matching:
      replay:
        # TR-02, Q-T6 run in this profile: after a restart or a lost stream, the closed 1-minute candles the
        # paper matching engine missed are fetched from the exchange and replayed.
        enabled: true
  journal:
    funding-correction:
      # T-048b runs in this profile: closed trades whose funding was incomplete are recomputed every 10 minutes.
      enabled: true
  alert:
    # NSF-06 runs in this profile: PRICE alerts on the 1-minute candle updates, and the expiry sweep.
    enabled: true
    expiry-sweep:
      enabled: true

springdoc:
  # TECHNICAL_DESIGN 8: no API document and no Swagger UI in production.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
