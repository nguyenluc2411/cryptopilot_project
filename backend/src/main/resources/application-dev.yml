spring:
  datasource:
    # Host and database name have a local default; the password never does, so an unset
    # environment fails at start-up instead of falling back to a value someone could guess.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptopilot}
    username: ${DB_USER:cryptopilot}
    password: ${DB_PASSWORD}
  flyway:
    # Development, and nowhere else, also applies the sample data. The list replaces the one in the
    # base configuration rather than adding to it, which is why the production path is repeated
    # here: a developer database is the production schema plus the demo set, in that order.
    locations: classpath:db/migration,classpath:db/demo

logging:
  level:
    com.cryptopilot: DEBUG

cryptopilot:
  market:
    sync:
      # NSF-01 runs in this profile: at start-up and on the schedule of application.yml.
      enabled: true
      # The demo pairs (Q-05), created INACTIVE by NSF-01 the first time each market lists them; an
      # administrator activates them (here Q-16 does, see demo below). Each is spelled the same on Spot and
      # USD-M futures (Q-14).
      seed-symbols:
        - BTCUSDT
        - ETHUSDT
        - BNBUSDT
        - SOLUSDT
        - XRPUSDT
        - DOGEUSDT
        - ADAUSDT
        - AVAXUSDT
        - LINKUSDT
        - LTCUSDT
        - BCHUSDT
        - UNIUSDT
        - ARBUSDT
    backfill:
      # NSF-02 runs in this profile: after each symbol synchronisation and on the hourly schedule of
      # application.yml, within half of each venue's weight budget.
      enabled: true
    stream:
      # NSF-03 runs in this profile: the streams of the pairs an administrator enabled (BR-07).
      enabled: true
    cache:
      # T-022 runs in this profile: the latest prices are written to Redis.
      enabled: true
    hub:
      # T-022 runs in this profile: the market topics are pushed to STOMP clients.
      enabled: true
    futures-metrics:
      # NSF-04 runs in this profile: the futures metrics and funding settlements of the streamed pairs.
      enabled: true
    demo:
      # Q-16, dev only: activate the seed symbols above on every market where the exchange trades them, once
      # after the first symbol synchronisation, so NSF-03 has pairs to stream. Never set in prod (BR-07).
      activate-seed-symbols: true
