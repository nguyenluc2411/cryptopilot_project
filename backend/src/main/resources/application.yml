spring:
  application:
    name: cryptopilot
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it, and refuses to
      # start when they do not (Q-10). Never `update`, never `create`: a mapping change has to be
      # written as a migration and reviewed, not applied by the ORM at start-up.
      ddl-auto: validate
    # The persistence context ends with the transaction. Leaving it open across the view would let
    # a controller trigger a lazy load, which the layer rules of the design forbid.
    open-in-view: false
  flyway:
    # The production migration path, and only it. Sample data lives in classpath:db/demo, which the
    # dev profile adds; nothing here reaches it, so a staging or production database cannot acquire
    # a demo row by way of a flag that was left in the wrong state.
    locations: classpath:db/migration
    # The schema is written by hand and applied only forwards; dropping it is never a build step.
    clean-disabled: true
    placeholders:
      # The bootstrap administrator's password, already hashed, from the environment. No password
      # and no hash is ever committed. The fallback is not a hash in any format an encoder produces,
      # so until the environment supplies one the seeded account exists but no password matches it.
      admin_password_hash: ${ADMIN_PASSWORD_HASH:!ADMIN_PASSWORD_HASH_NOT_SET}
      # The same, for the demo trader of classpath:db/demo. It is declared here rather than beside
      # the dev profile so that the placeholder resolves whatever locations are configured.
      demo_password_hash: ${DEMO_PASSWORD_HASH:!DEMO_PASSWORD_HASH_NOT_SET}

cryptopilot:
  auth:
    token:
      # SRS 3.2.3 states all three windows. They are declared rather than hard-coded because an
      # incident that needs every access token in the estate to age out faster is answered by a
      # restart, not by a release; the values themselves are the SRS values and a test asserts them.
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      remember-me-refresh-token-ttl: 30d
      # The HS256 signing key, from the environment, with no fallback of any kind (D-20). A default
      # here would be a key held by every reader of this repository, and a token signed with it would
      # be a session on any deployment that forgot to override it. An environment that supplies
      # nothing fails at start-up, which is the only safe way for this particular value to be missing.
      secret: ${JWT_SECRET}
  market:
    binance:
      # The public market data API only (BR-09): no key, no account, no order endpoint. Hosts and
      # per-minute REQUEST_WEIGHT budgets are the documented values, verified 2026-09-24 and recorded
      # with their sources in TECHNICAL_DESIGN 7.1.1. The client reads the used weight from every
      # response and stops for the rest of the minute at weight-pause-percent of the budget.
      spot:
        base-url: https://api.binance.com
        request-weight-per-minute: 6000
      futures:
        base-url: https://fapi.binance.com
        request-weight-per-minute: 2400
      connect-timeout: 5s
      read-timeout: 10s
      weight-pause-percent: 80
      # When a 429 or 418 carries no Retry-After. The documented bans start at two minutes.
      default-retry-after: 2m
      retry:
        # Transient failures only (5xx, timeouts, refused connections), never a 4xx.
        max-retries: 2
        initial-delay: 500ms
        multiplier: 2.0
        max-delay: 5s
        jitter: 200ms
      circuit-breaker:
        failure-threshold: 5
        open-duration: 30s
    sync:
      # NSF-01: at start-up and daily at 00:05 UTC. Off here and on in the dev and prod profiles, so that a
      # test context, which runs without a profile, never schedules a call to the real exchange.
      enabled: false
      cron: "0 5 0 * * *"
      zone: UTC
      # Symbols the synchronisation may create (INACTIVE) if missing. Empty until the demo pair list (Q-05)
      # is decided; until then only pairs an administrator registered are updated.
      seed-symbols: []
    backfill:
      # NSF-02: after each symbol synchronisation and hourly, one minute past the hour. Off here, on in the
      # dev and prod profiles, for the reason sync is (a test context never calls the exchange).
      enabled: false
      cron: "0 1 * * * *"
      zone: UTC
      # At most this share of a venue's per-minute weight; NSF-01 and the other jobs keep the rest.
      budget-share-percent: 50
      # D-41: how far back a series with no candle starts (BR-08 stores 15m, 1h, 4h, 1d only).
      depth:
        fifteen-minutes: 60d
        one-hour: 180d
        four-hours: 730d
        one-day: 1000d
      # The cheapest page per candle at the weights measured 2026-09-24 (TECHNICAL_DESIGN 7.1.1).
      page-size:
        spot: 1000
        futures: 500

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
