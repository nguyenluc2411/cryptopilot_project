spring:
  datasource:
    hikari:
      # TR-02: every order placement holds a connection for its whole transaction, so the pool is what many Traders
      # placing at once wait on. The default of 10 is too few; a deployment sets DB_POOL_SIZE to what its Postgres
      # (max_connections) can spare. Waiting longer than the timeout answers 5xx rather than hanging.
      # D-93: an indicator or open interest alert trigger holds a second connection while the thread that committed
      # the candle or the reading still holds its own, which alone needs 22 = 2 x 4 candle partitions + 2 alert
      # partitions + 2 for the NSF-04 thread + 10 for web requests and schedulers. 30 covers both and stays well
      # under PostgreSQL's default max_connections of 100.
      maximum-pool-size: ${DB_POOL_MAX:30}
      # Opened on demand above this: an idle instance, or one of the many contexts a test run keeps, holds only these.
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:10000}
  data:
    redis:
      # The latest-price cache (TD 5.6, ADR-005). Local defaults; a deployment sets REDIS_HOST/PORT/PASSWORD.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  application:
    name: cryptopilot
  modulith:
    events:
      # ADR-010, T-056: the transactional outbox. Flyway owns event_publication (V1), so the registry never creates it.
      jdbc:
        schema-initialization:
          enabled: false
      # Only @ApplicationModuleListener deliveries are recorded; the in-memory @TransactionalEventListener hand-offs of
      # the market, trading, paper and watchlist workers stay as they were.
      registry-trigger-annotation: org.springframework.modulith.events.ApplicationModuleListener
      # A delivered publication is deleted at once: the auth events carry a working link (A-18), which must not stay
      # in the table after the mail went out.
      completion-mode: delete
      # Left off: OutboxProcessorJob runs at start-up instead, after the application is ready and within the retry cap.
      republish-outstanding-events-on-restart: false
  mail:
    # T-057: the SMTP server of the mail adapter. Empty host: no mail is sent and the links are logged instead (never
    # in prod, which refuses to start). STARTTLS is required: a server that does not offer it gets neither the login nor
    # the mail, and the delivery fails and is retried. Only a local sink such as Mailpit sets SMTP_STARTTLS_REQUIRED=false.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_REQUIRED:true}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it, and refuses to
      # start when they do not (Q-10). Never `update`, never `create`: a mapping change has to be
      # written as a migration and reviewed, not applied by the ORM at start-up.
      ddl-auto: validate
    # The persistence context ends with the transaction. Leaving it open across the view would let
    # a controller trigger a lazy load, which the layer rules of the design forbid.
    open-in-view: false
    properties:
      hibernate:
        # TR-02: a paper order writes the order, its fill, two to three ledger entries and two balances at commit.
        # Sent as one batch per table instead of one round trip per row; the keys are UUID v7 generated in the
        # application, so nothing waits for the database to return an id.
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
  flyway:
    # The production migration path, and only it. Sample data lives in classpath:db/demo, which the
    # dev profile adds; nothing here reaches it, so a staging or production database cannot acquire
    # a demo row by way of a flag that was left in the wrong state.
    locations: classpath:db/migration
    # The schema is written by hand and applied only forwards; dropping it is never a build step.
    clean-disabled: true
    placeholders:
      # The bootstrap administrator's password, already hashed, from the environment. No password
      # and no hash is ever committed. The fallback is not a hash in any format an encoder produces,
      # so until the environment supplies one the seeded account exists but no password matches it.
      admin_password_hash: ${ADMIN_PASSWORD_HASH:!ADMIN_PASSWORD_HASH_NOT_SET}
      # The same, for the demo trader of classpath:db/demo. It is declared here rather than beside
      # the dev profile so that the placeholder resolves whatever locations are configured.
      demo_password_hash: ${DEMO_PASSWORD_HASH:!DEMO_PASSWORD_HASH_NOT_SET}

cryptopilot:
  outbox:
    # T-056, ADR-010: resubmits the event publications whose listener failed. Off here, on in the dev and prod
    # profiles, so a test context schedules nothing.
    enabled: false
    interval: 1m
    # A failed delivery is retried at least 1, 2 and then 4 minutes after its last attempt, at most max-retries times.
    # A retry runs on the first run after it is due, so with a 1-minute interval the waits are about 2, 2 and 4 minutes.
    first-retry-after: 1m
    max-retries: 3
    # A publication still unfinished this long after its last attempt is taken for crashed and retried.
    stale-after: 5m
    # Anything older is deleted, delivered or not: the longest link an event carries lives 24 hours (BR-01).
    retention: 24h
  media:
    cloudinary:
      # T-061 (D-98): the account post images and videos are stored in. The browser uploads straight to Cloudinary
      # with a form the backend signs; the secret never leaves the backend. All three empty: posts with media are
      # refused and text posts work (dev and tests); the prod profile refuses to start.
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      api-base-url: https://api.cloudinary.com
      # Every file of a post is stored under <folder>/<uploader account>/<random key>.
      folder: cryptopilot/posts
      connect-timeout: 5s
      read-timeout: 10s
    sweep:
      # Files uploaded with a signed form but never attached to a post, or left by a failed deletion, are deleted
      # once older than the grace period. Daily; off here, on in the dev and prod profiles.
      enabled: false
      cron: "0 45 0 * * *"
      zone: UTC
      grace: 24h
      max-pages: 20
  notification:
    mail:
      # T-057: the sender address, and the web application the mailed links open (/verify-email, /reset-password).
      from: ${SMTP_FROM:no-reply@cryptopilot.local}
      public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    sweep:
      # NSF-17, notifications: daily, deletes those older than the retention (90 days, SRS 3.4.5). Off here, on in
      # the dev and prod profiles, so a test context schedules nothing.
      enabled: false
      cron: "0 30 0 * * *"
      zone: UTC
      retention: 90d
  web:
    # Reverse proxies whose X-Forwarded-For is believed: addresses or CIDR ranges, comma-separated. Empty trusts none,
    # so the direct peer is the client. Set wherever Nginx sits in front.
    trusted-proxies: ${TRUSTED_PROXIES:}
    cors:
      # TD 5.3: the browser origins that may call the REST API and open /ws, one list for both, comma-separated
      # (scheme://host[:port]). Empty allows no cross-origin caller.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit:
      # ADR-014: requests per one-minute window and subject (login and the other public auth calls per client address,
      # authenticated calls per account, calls without an account per client address). Off here so a test context is
      # not limited; on in the dev and prod profiles.
      enabled: false
      window: 1m
      login: ${RATE_LIMIT_LOGIN:10}
      auth: ${RATE_LIMIT_AUTH:20}
      api: ${RATE_LIMIT_API:120}
      # Guests (public market data and forum reads, D-99), per client address: several Guests may share one.
      guest: ${RATE_LIMIT_GUEST:300}
      # Placing a paper order is counted apart from the calls above, in a window of its own, as Binance does (50 new
      # orders in 10 seconds); cancels and reads are not counted.
      paper-orders: ${RATE_LIMIT_PAPER_ORDERS:50}
      paper-orders-window: 10s
  realtime:
    # TD 9: the STOMP endpoint's transport limits, so one slow client cannot hold the others (Spring's per-session
    # decorator buffers up to the limit, then closes that session). Its origins are cryptopilot.web.cors above.
    send-time-limit: 10s
    send-buffer-size-limit: 512KB
  auth:
    token:
      # SRS 3.2.3 states all three windows. They are declared rather than hard-coded because an
      # incident that needs every access token in the estate to age out faster is answered by a
      # restart, not by a release; the values themselves are the SRS values and a test asserts them.
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      remember-me-refresh-token-ttl: 30d
      # The HS256 signing key, from the environment, with no fallback of any kind (D-20). A default
      # here would be a key held by every reader of this repository, and a token signed with it would
      # be a session on any deployment that forgot to override it. An environment that supplies
      # nothing fails at start-up, which is the only safe way for this particular value to be missing.
      secret: ${JWT_SECRET}
    token-sweep:
      # NSF-17, refresh tokens: daily, deletes those past their own expiry; used ones are kept until then so a
      # replay still revokes the family. Off here, on in the dev and prod profiles, so a test context schedules
      # nothing.
      enabled: false
      cron: "0 15 0 * * *"
      zone: UTC
  market:
    binance:
      # The public market data API only (BR-09): no key, no account, no order endpoint. Hosts and
      # per-minute REQUEST_WEIGHT budgets are the documented values, verified 2026-09-24 and recorded
      # with their sources in TECHNICAL_DESIGN 7.1.1. The client reads the used weight from every
      # response and stops for the rest of the minute at weight-pause-percent of the budget.
      spot:
        base-url: https://api.binance.com
        request-weight-per-minute: 6000
      futures:
        base-url: https://fapi.binance.com
        request-weight-per-minute: 2400
      connect-timeout: 5s
      read-timeout: 10s
      weight-pause-percent: 80
      # When a 429 or 418 carries no Retry-After. The documented bans start at two minutes.
      default-retry-after: 2m
      retry:
        # Transient failures only (5xx, timeouts, refused connections), never a 4xx.
        max-retries: 2
        initial-delay: 500ms
        multiplier: 2.0
        max-delay: 5s
        jitter: 200ms
      circuit-breaker:
        failure-threshold: 5
        open-duration: 30s
    sync:
      # NSF-01: at start-up and daily at 00:05 UTC. Off here and on in the dev and prod profiles, so that a
      # test context, which runs without a profile, never schedules a call to the real exchange.
      enabled: false
      cron: "0 5 0 * * *"
      zone: UTC
      # Symbols the synchronisation may create (INACTIVE) if missing. Empty until the demo pair list (Q-05)
      # is decided; until then only pairs an administrator registered are updated.
      seed-symbols: []
    backfill:
      # NSF-02: after each symbol synchronisation and hourly, one minute past the hour. Off here, on in the
      # dev and prod profiles, for the reason sync is (a test context never calls the exchange).
      enabled: false
      cron: "0 1 * * * *"
      zone: UTC
      # At most this share of a venue's per-minute weight; NSF-01 and the other jobs keep the rest.
      budget-share-percent: 50
      # D-41: how far back a series with no candle starts (BR-08 stores 15m, 1h, 4h, 1d only).
      depth:
        fifteen-minutes: 60d
        one-hour: 180d
        four-hours: 730d
        one-day: 1000d
      # The cheapest page per candle at the weights measured 2026-09-24 (TECHNICAL_DESIGN 7.1.1).
      page-size:
        spot: 1000
        futures: 500
      # A-33: at start-up, holes inside the stored series of the last 7 days are found and filled.
      gap-scan-window: 7d
    api:
      # UC-09: every market data request is bounded in points and in time. SCR-10 draws 500 closed candles; the
      # 5-minute futures metrics of SCR-11 are 2,016 points per series over seven days.
      default-candles: 500
      max-candles: 1000
      default-metrics-range: 1d
      max-metrics-range: 7d
    cache:
      # T-022: the latest prices in Redis (TD 5.6): px:{market}:{symbol}, 5 minutes to live. Written by a flush that
      # never runs on the stream thread; off here, on in dev and prod, so a test context schedules nothing.
      enabled: false
      ttl: 5m
      flush-interval: 250ms
    hub:
      # T-022: the STOMP market topics (TD 9): ticker at most once a second per destination, overview every 2 s.
      enabled: false
      update-interval: 1s
      overview-interval: 2s
      # TR-03: the trades and depth of the trading screen, pushed in windows of 100 ms (plan section 12.3).
      trading-interval: 100ms
    indicators:
      # T-025: a series is rebuilt from its latest stored closed candles (TD 7.2: 1000, so EMA200 no longer depends on
      # where the history starts). No schedule: the indicators follow the closed candles.
      history-candles: 1000
    setup-score:
      # T-027, D-53: style presets v1. Each market's weights add up to 100, each 1–40; checked at start-up.
      # SCALPING's primary timeframe is 5m; 15m is the nearest one BR-08 ingests.
      presets:
        SCALPING:
          version: v1
          timeframe: 15m
          spot: { trend: 20, momentum: 40, volume: 25, level: 15 }
          futures: { trend: 15, momentum: 35, volume: 20, level: 10, derivatives: 20 }
        DAY_TRADING:
          version: v1
          timeframe: 1h
          spot: { trend: 35, momentum: 30, volume: 15, level: 20 }
          futures: { trend: 30, momentum: 25, volume: 15, level: 15, derivatives: 15 }
        SWING:
          version: v1
          timeframe: 4h
          spot: { trend: 40, momentum: 20, volume: 10, level: 30 }
          futures: { trend: 35, momentum: 15, volume: 10, level: 25, derivatives: 15 }
    futures-metrics:
      # NSF-04: every 5 minutes, 90 s after the 5-minute instant, the funding settlements and then the open
      # interest and long/short account ratio of the pairs NSF-03 streams. Off here, on in the dev and prod
      # profiles, so a test context never calls the exchange. Limits verified 2026-09-25 (TECHNICAL_DESIGN 7.1.1).
      enabled: false
      cron: "30 1/5 * * * *"
      zone: UTC
      # BR-10: the exchange keeps the latest month of history; a pair with nothing stored starts this far back.
      depth: 30d
      # The exchange's maximum per call.
      page-size: 500
      # The history endpoints allow 1000 calls per 5 minutes per IP; a run stops here and the next continues.
      max-requests-per-run: 400
      settlement-depth: 30d
      # An older streamed next funding time is read from premiumIndex instead (BR-11).
      mark-price-max-age: 2m
    stream:
      # NSF-03: the public market streams of the enabled pairs. Off here, on in the dev and prod profiles, so a
      # test context never connects to the exchange. Hosts verified 2026-09-24 (TECHNICAL_DESIGN 7.1.1): futures
      # klines and mark prices are served under the /market route only; the unrouted host sends them no more.
      enabled: false
      spot-url: wss://stream.binance.com:9443
      futures-url: wss://fstream.binance.com/market
      # TECHNICAL_DESIGN 7.1 step 1; the exchange allows 1024 per connection.
      max-streams-per-connection: 100
      connect-timeout: 10s
      # NSF-03: exponential back-off from 1 s up to 60 s, each wait shortened at random by up to 20 %.
      reconnect:
        initial: 1s
        max: 60s
        jitter-percent: 20
      # Renewed before the exchange ends a connection at 24 hours.
      renew-after: 23h
      # Every connection carries a once-a-second ticker or mark price; a minute of silence is a dead connection.
      idle-timeout: 60s
      refresh-interval: 5m
      snapshot-interval: 60s
      snapshot-max-age: 2m
      partitions: 4
      queue-capacity: 10000
      trading:
        # TR-03: each Spot pair also streams @aggTrade, @bookTicker and @depth20@100ms for the paper engine and the
        # trading screen: nine streams a pair instead of six.
        enabled: true
        depth-levels: 20
        # A best bid and ask or depth older than this is not served as current (a lost stream).
        max-age: 10s
        # The latest trades kept per pair for the trades panel.
        recent-trades: 50
  user:
    risk-profiles:
      # T-103, BR-66, D-53: risk profiles v1, percentages of capital. No profile may exceed AGGRESSIVE; checked at
      # start-up. The minimum setup score to alert is kept here but no feature reads it in this release.
      profiles:
        CONSERVATIVE:
          risk-per-trade-percent: 0.5
          max-futures-leverage: 3
          max-total-open-risk-percent: 2
          min-setup-score-to-alert: 75
        BALANCED:
          risk-per-trade-percent: 1
          max-futures-leverage: 5
          max-total-open-risk-percent: 4
          min-setup-score-to-alert: 65
        AGGRESSIVE:
          risk-per-trade-percent: 2
          max-futures-leverage: 10
          max-total-open-risk-percent: 6
          min-setup-score-to-alert: 55
  paper:
    account:
      # TR-04, Q-T5: the virtual funds a paper account is opened with, granted once; there is no reset. Keys in lower
      # case, the form an environment variable binds to, so CRYPTOPILOT_PAPER_ACCOUNT_SPOTGRANT_USDT replaces usdt
      # here instead of adding a second key. At most 8 decimals; the Futures wallet holds USDT only (USDⓈ-M).
      spot-grant:
        usdt: 10000
        btc: 0.1
        eth: 1
        bnb: 10
      futures-grant:
        usdt: 5000
    order:
      # TR-02: the commission of a Spot fill, taken in the coin it brings in; Binance's standard 0.1% maker and taker.
      spot-maker-fee-rate: 0.001
      spot-taker-fee-rate: 0.001
    equity-snapshot:
      # TR-13: every paper account's worth at the start of the day, the base of today's PnL and the asset chart. Off
      # here, on in the dev and prod profiles, so a test context schedules nothing.
      enabled: false
      cron: "0 0 0 * * *"
      zone: UTC
      # PT-R02: an account with a coin that has no current price gets no snapshot; it is tried again this often,
      # until this time of the day.
      retry-interval: 5m
      retry-until: "23:55"
    grant-cost:
      # PT-R13: the granted coins that had no price at the opening get their cost once they have one. Off here, on in
      # the dev and prod profiles.
      enabled: false
      interval: 5m
    matching:
      # TR-05, Q-T8: a price through a waiting LIMIT order's own always fills it. At exactly its price: QUEUE, as
      # Binance's price-time priority, once the quantity the exchange's book showed ahead of it there is traded; CROSS
      # never; TOUCH always.
      limit-fill-mode: QUEUE
      # TR-05: while a pair's market trades flow they fill orders at once; after this long without one its forming
      # 1-minute candles fill orders again (a lost trade stream, or a pair streamed without trades).
      trade-silence: 5s
  alert:
    # NSF-06, T-055: PRICE alerts evaluated on the 1-minute candle updates. Off here, on in the dev and prod
    # profiles, so a test context starts no engine.
    enabled: false
    partitions: 2
    queue-capacity: 1000
    # SRS 3.4.4: at most one evaluation per second per pair.
    throttle: 1s
    # After a stream reconnects, a cross is not measured from a previous price older than this.
    staleness: 5m
    # How long a removed alert's version blocks a stale read of it. Must be longer than the longest read of an
    # alert (Hikari connection-timeout plus jakarta.persistence.query.timeout), or the context does not start.
    tombstone-ttl: 5m
    stop-timeout: 5s
    expiry-sweep:
      # BR-19: alerts past their expiry become EXPIRED. Off here, on in the dev and prod profiles.
      enabled: false
      cron: "0 * * * * *"
      zone: UTC

springdoc:
  # TECHNICAL_DESIGN 8: the OpenAPI document and Swagger UI at their standard paths; off in the prod profile.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.cryptopilot

server:
  port: 8080
  # The client address is resolved once, by ClientAddressFilter, from cryptopilot.web.trusted-proxies. The container
  # must not apply its own forwarded-header handling on top (R-11).
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis is a cache (ADR-005): losing it costs a warm-up, never data, so it does not make the application unhealthy.
      enabled: false
    mail:
      # T-057: an SMTP outage only delays mail (the outbox retries it), so it does not make the application unhealthy.
      enabled: false
