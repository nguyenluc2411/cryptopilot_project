spring:
  application:
    name: cryptopilot
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration
    # The schema is written by hand and applied only forwards; dropping it is never a build step.
    clean-disabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
