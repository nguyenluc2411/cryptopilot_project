# Local development. By default only the infrastructure (database and Redis) starts, and the backend, AI service and
# web app run from the IDE:
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.dev.yml up -d
# The "app" profile starts them in containers too (T-004): the backend (dev profile), the AI Service and the web app's
# Vite development server, from the web repository at WEB_DIR (default: next to this repository):
#   docker compose -f deploy/docker-compose.dev.yml --profile app up -d --build
# Stop the IDE's backend, AI Service and Vite first: the containers take the same ports (8080, 7070, 5173).
name: cryptopilot-dev

services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: cryptopilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cryptopilot}
      POSTGRES_USER: ${DB_USER:-cryptopilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    container_name: cryptopilot-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    profiles: ["app"]
    build: ../ai-service
    image: cryptopilot/ai-service:dev
    container_name: cryptopilot-ai-service
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 7070
    ports:
      - "7070:7070"

  backend:
    profiles: ["app"]
    build: ../backend
    image: cryptopilot/backend:dev
    container_name: cryptopilot-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx900m -XX:+ExitOnOutOfMemoryError}
      # The services' names on the compose network, not localhost.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-cryptopilot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:7070
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    image: node:22.20-alpine
    container_name: cryptopilot-web
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_WS_URL: ws://localhost:8080/ws
    volumes:
      - ${WEB_DIR:-../../cryptopilot-frontend}:/app
      # Linux packages of the container, apart from the host's node_modules.
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
  web_node_modules:
